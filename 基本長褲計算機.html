<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本長褲原型 - 專業計算機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --bg-color: #f6fdfa;
            --primary-accent: #10b981;
            --primary-dark: #065f46;
            --input-focus: #d1fae5;
            --section-bg: #ecfdf5;
            --text-main: #374151;
            --text-muted: #9ca3af;
            --card-border: #e6f4ef;
            
            --line-red: #ef4444;
            --line-blue: #3b82f6;
            --line-green: #10b981;
            --line-yellow: #f59e0b;
            --line-pink: #ec4899;
            --line-purple: #a855f7;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }
        
        .data-card { 
            background: white; 
            padding: 0.8rem; 
            border-radius: 0.75rem; 
            border: 1px solid var(--card-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .data-card:hover { 
            border-color: var(--primary-accent); 
            transform: translateY(-2px); 
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.1); 
        }
        
        .label-text { font-size: 0.75rem; color: #6b7280; font-weight: 500; margin-bottom: 2px; }
        .value-text { font-size: 1.1rem; font-weight: 800; color: var(--primary-dark); font-family: 'Consolas', monospace; }
        
        .section-title { 
            grid-column: span 2; 
            font-weight: 800; 
            font-size: 0.85rem; 
            color: var(--primary-dark); 
            background: var(--section-bg); 
            padding: 8px 14px; 
            border-radius: 8px; 
            margin-top: 14px; 
            display: flex; 
            justify-content: space-between; 
            border-left: 4px solid var(--primary-accent);
        }

        .input-focus-style:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 4px rgba(209, 250, 229, 0.4);
            background-color: white;
        }

        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
        
        .tab-btn {
            padding: 10px 24px;
            font-weight: 700;
            transition: all 0.3s;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            color: #9ca3af;
            user-select: none;
        }
        .tab-btn.active {
            color: var(--primary-dark);
            border-bottom-color: var(--primary-accent);
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 顏色文字樣式 */
        .badge-red { color: var(--line-red); font-weight: bold; }
        .badge-blue { color: var(--line-blue); font-weight: bold; }
        .badge-green { color: var(--line-green); font-weight: bold; }
        .badge-yellow { color: var(--line-yellow); font-weight: bold; }
        .badge-pink { color: var(--line-pink); font-weight: bold; }
        .badge-purple { color: var(--line-purple); font-weight: bold; }

        .unified-note-text {
            font-size: 0.85rem; 
            color: #374151; 
            line-height: 1.6;
        }

        .image-frame {
            position: relative;
            background-color: #f9fafb;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid #f3f4f6;
            transition: aspect-ratio 0.3s ease;
        }

        /* 針對長圖的特殊樣式 */
        .image-frame.long-format {
            aspect-ratio: 1 / 1.8; /* 調整為適合長褲版型的比例 */
        }

        .nav-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-black text-gray-800 tracking-tight">基本長褲原型計算機</h1>
        </header>

        <!-- 數值輸入區 -->
        <div class="bg-white rounded-3xl shadow-sm p-6 mb-4 border border-emerald-50">
            <div class="grid grid-cols-5 gap-2">
                <div>
                    <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-tighter mb-1 text-center">腰圍 (W)</label>
                    <input type="number" id="inputW" value="72" oninput="updateAll()" class="w-full p-2 bg-emerald-50/30 border-2 border-transparent rounded-xl input-focus-style outline-none text-lg font-black text-center text-gray-800 transition-all">
                </div>
                <div>
                    <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-tighter mb-1 text-center">臀圍 (H)</label>
                    <input type="number" id="inputH" value="92" oninput="updateAll()" class="w-full p-2 bg-emerald-50/30 border-2 border-transparent rounded-xl input-focus-style outline-none text-lg font-black text-center text-gray-800 transition-all">
                </div>
                <div>
                    <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-tighter mb-1 text-center">腰長</label>
                    <input type="number" id="inputWL" value="18" oninput="updateAll()" class="w-full p-2 bg-emerald-50/30 border-2 border-transparent rounded-xl input-focus-style outline-none text-lg font-black text-center text-gray-800 transition-all">
                </div>
                <div>
                    <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-tighter mb-1 text-center">股上</label>
                    <input type="number" id="inputGL" value="25" oninput="updateAll()" class="w-full p-2 bg-emerald-50/30 border-2 border-transparent rounded-xl input-focus-style outline-none text-lg font-black text-center text-gray-800 transition-all">
                </div>
                <div>
                    <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-tighter mb-1 text-center">褲長</label>
                    <input type="number" id="inputPL" value="90" oninput="updateAll()" class="w-full p-2 bg-emerald-50/30 border-2 border-transparent rounded-xl input-focus-style outline-none text-lg font-black text-center text-gray-800 transition-all">
                </div>
            </div>
        </div>

        <!-- 分頁切換 -->
        <div class="flex justify-center space-x-2 border-b border-emerald-100 mb-6">
            <div id="tab1-btn" class="tab-btn active text-sm" onclick="switchTab(1)">數據計算</div>
            <div id="tab2-btn" class="tab-btn text-sm" onclick="switchTab(2)">打版步驟教學</div>
        </div>

        <!-- 數據計算分頁 -->
        <div id="tab1-content" class="tab-content active">
            <div class="grid grid-cols-2 gap-3">
                <div class="section-title"><span>基礎寬度與分配</span></div>
                <div class="data-card"><p class="label-text">臀圍寬 (H+4)/4</p><p class="value-text" id="v1">0.0</p></div>
                <div class="data-card"><p class="label-text">▲</p><p class="value-text" id="v2">0.0</p></div>
                
                <div class="section-title"><span>腰圍與細節</span></div>
                <div class="data-card"><p class="label-text">(W+1)/4+1</p><p class="value-text" id="v3">0.0</p></div>
                <div class="data-card"><p class="label-text">●</p><p class="value-text" id="v4">0.0</p></div>
                
                <div class="section-title"><span>長度相關</span></div>
                <div class="data-card"><p class="label-text">(褲長-股上長)x0.4</p><p class="value-text" id="v5">0.0</p></div>
                <div class="data-card"><p class="label-text">(W+1)/4-1</p><p class="value-text" id="v6">0.0</p></div>
            </div>
        </div>

        <!-- 打版步驟教學分頁 -->
        <div id="tab2-content" class="tab-content">
            <!-- 修改此處的示範參數提示框 -->
            <div class="mb-4 bg-gray-50 border-y border-gray-100 py-2 flex justify-center">
                <div class="flex items-center space-x-4 text-[11px] font-medium text-gray-500">
                    <span class="text-gray-400 font-bold">SAMPLE:</span>
                    <div class="flex items-center"><span class="mr-1">腰圍 (W)</span><span class="font-bold font-mono text-gray-700">64 cm</span></div>
                    <span class="text-gray-300">/</span>
                    <div class="flex items-center"><span class="mr-1">臀圍 (H)</span><span class="font-bold font-mono text-gray-700">92 cm</span></div>
                    <span class="text-gray-300">/</span>
                    <div class="flex items-center"><span class="mr-1">腰長</span><span class="font-bold font-mono text-gray-700">19 cm</span></div>
                    <span class="text-gray-300">/</span>
                    <div class="flex items-center"><span class="mr-1">股上</span><span class="font-bold font-mono text-gray-700">27 cm</span></div>
                    <span class="text-gray-300">/</span>
                    <div class="flex items-center"><span class="mr-1">褲長</span><span class="font-bold font-mono text-gray-700">95 cm</span></div>
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-emerald-50 mb-8">
                <!-- 主圖框 -->
                <div class="image-frame" id="mainFrame">
                    <img id="stepImage" src="" alt="打版步驟圖" class="max-w-full max-h-full object-contain hidden" onerror="handleImageError('main')">
                    <div id="imagePlaceholder" class="text-gray-400 text-center p-12">
                        <svg class="w-16 h-16 mx-auto mb-4 opacity-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-width="1.5"></path></svg>
                        <p id="placeholderText" class="text-sm font-medium">圖片載入中...</p>
                    </div>
                </div>

                <div class="p-6 space-y-6">
                    <div class="flex justify-between items-center bg-gray-50/50 p-3 rounded-2xl border border-gray-100">
                        <button onclick="prevStep()" class="nav-btn p-2.5 px-5 bg-white text-gray-500 rounded-xl font-bold border border-gray-200 hover:bg-gray-100 transition-all text-xs shadow-sm">上一步</button>
                        <div class="text-center"><span id="stepCounter" class="text-base font-black text-emerald-600">0 / 0</span></div>
                        <button onclick="nextStep()" class="nav-btn p-2.5 px-5 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 shadow-lg shadow-emerald-100 transition-all text-xs">下一步</button>
                    </div>
                    
                    <div id="stepDescription" class="space-y-3 text-gray-700 text-sm leading-relaxed font-medium">
                        <!-- 步驟內容由 JS 自動渲染 -->
                    </div>

                    <!-- 補充圖片容器 (由 JS 動態生成) -->
                    <div id="subImagesContainer" class="space-y-4"></div>

                    <!-- 補充備註區 - 翡翠綠樣式 -->
                    <div id="textNoteArea" class="p-4 bg-emerald-50/50 rounded-2xl border-l-4 border-emerald-300 hidden">
                        <div class="flex items-start">
                            <span class="mr-2 text-emerald-500">💡</span>
                            <div id="primaryNoteText" class="unified-note-text text-[13px] font-medium"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 1;
        let currentStep = 0;
        let calculations = {};

        const stepsData = [
            {
                fileName: "image/基本長褲版型(1).png",
                description: [
                    { html: '1. <span class="badge-red">紅</span>：依照腰長和股上，水平畫出腰圍線(WL)、臀圍線(HL)和股上線' },
                    { html: '2. <span class="badge-blue">藍</span>：取前片臀圍寬 {{v1}}，畫垂直線' },
                    { html: '3. <span class="badge-green">綠</span>：再將臀圍寬分成四等份，量出一等份長度為 {{v2}}，在股上線 A 點往右取 {{v2}} 得到 B 點，連接 BC' },
                    { html: '4. <span class="badge-yellow">黃</span>：在 BD 線段中心點，垂直畫折山線，也就是前片褲管的中心線(西裝褲管折燙的那條線)，會延伸到褲口' }
                ]
            },
            {
                fileName: "image/基本長褲版型(2).png",
                subImages: ["image/基本長褲版型(2-1).png", "image/基本長褲版型(2-2).png"],
                description: [
                    { html: '1. <span class="badge-red">紅</span>：WL 上 E 點向左移 0.5 和 C 點連成直線，並向上延伸 0.3，此為前中心線' },
                    { html: '2. <span class="badge-blue">藍</span>：自前中心線和 WL 的交點向左取 {{v3}} 得 F 點，將 FG 線段分成三等份，量出一等份長度為 {{v4}}' },
                    { html: '3. <span class="badge-green">綠</span>：自 H 點畫弧線至一等份位置，並往上延伸 1，此為前脇邊線' },
                    { html: '4. <span class="badge-yellow">黃</span>：連接前中心和脇邊頂端，畫出前腰圍弧線，相接處要垂直' }
                ]
            },
            {
                fileName: "image/基本長褲版型(3).png",
                subImages: ["image/基本長褲版型(3-1).png"],
                description: [
                    { html: '1. <span class="badge-red">紅</span>：WL 往下 9~10 畫一水平線，為前腰褶的長度' },
                    { html: '2. <span class="badge-blue">藍</span>：以折山線當褶子中心線，取褶寬 {{v4}} 畫出內腰褶' },
                    { html: '3. <span class="badge-green">綠</span>：將 IJ 及 KL 線段取中心點，連接中心點，為外腰褶中心線' },
                    { html: '4. <span class="badge-yellow">黃</span>：取褶寬 {{v4}} 畫出外腰褶' },
                    { html: '5. <span class="badge-pink">粉</span>：自 A 點畫一直線垂直 BC 線段，取三等份' },
                    { html: '6. <span class="badge-purple">紫</span>：自 C 點經過粉線段一等份點到 B 點連成前褲襠弧線' }
                ],
                note: "前片腰褶的長度可根據身形調整：\n· 小腹較凸出→短腰褶 (9 cm)\n· 小腹較平坦→長腰褶 (10 cm)"
            },
            {
                fileName: "image/基本長褲版型(4).png",
                isLongImage: true,
                description: [
                    { html: '1. <span class="badge-red">紅</span>：自 WL 往下取褲長，水平畫出褲口線，折山線延長至褲口' },
                    { html: '2. <span class="badge-blue">藍</span>：垂直畫出脇邊線和股下線至褲口' },
                    { html: '3. <span class="badge-green">綠</span>：自股上線往下取 {{v5}}，水平畫出膝線，前片完成' },
                    { html: '4. <span class="badge-yellow">黃</span>：拉鍊止點為 HL 往下 1，畫出拉鍊裝飾線寬 3' }
                ],
                note: "正常膝線應該在股下長的中間，本版型取「(褲長-股上長)x0.4」抬高膝線，腿的視覺比例較修長。"
            },
            {
                fileName: "image/基本長褲版型(5).png",
                description: [
                    { html: '1. <span class="badge-red">紅</span>：MN 線段取中心點，和 O 點連成直線，並往 WL 上延伸 2，此為後中心線' },
                    { html: '2. <span class="badge-blue">藍</span>：紅線和 HL 交於 P 點，自 P 點沿紅線往上取 2 得 Q 點，自 Q 點量一直線長度 {{v1}} 和 HL 交於 R 點，此為後片新臀圍線 (新HL)' },
                    { html: '3. <span class="badge-green">綠</span>：通過 R 點畫垂直線交於 WL 並往左取 {{v4}} (同前片脇邊) 得 S 點' },
                    { html: '4. <span class="badge-yellow">黃</span>：自 R 點畫弧線至 S 點，並往上延伸 1，此為後脇邊線，畫法和前脇邊線相同' },
                    { html: '5. <span class="badge-purple">紫</span>：連接後中心和脇邊頂端，畫出後腰圍弧線，相接處要垂直' }
                ],
                note: "新HL 為實際穿著時的臀圍線。後中心傾斜及上移 2cm 是為了增加臀部空間，若臀部比較翹可上移 3cm，可根據實際穿著的情況調整。"
            },
            {
                fileName: "image/基本長褲版型(6).png",
                description: [
                    { html: '1. <span class="badge-red">紅</span>：後片腰圍扣除後腰寬 {{v6}}，量取所得差值即為後腰褶寬★' },
                    { html: '2. <span class="badge-blue">藍</span>：取腰圍中點畫一直線與後中心平行' },
                    { html: '3. <span class="badge-yellow">黃</span>：自腰圍中點往下 13~14，再垂直往右 0.7 為褶尖點，取後腰褶寬★連成後腰褶' },
                    { html: '4. <span class="badge-pink">粉</span>：自 O 點畫一直線垂直 TU 線段，取三等份' },
                    { html: '5. <span class="badge-purple">紫</span>：自 T 點往左 4 再往下 0.5，與 Q 點連成弧線並經過粉線段一等份點，此為後褲襠弧線' }
                ],
                note: "後片腰褶長度可根據臀形調整或修飾臀型，腰褶較短的話有提臀效果，腰褶過長會顯下垂，所以後腰褶最好不要超過 14cm。"
            },
            {
                fileName: "image/基本長褲版型(7).png",
                isLongImage: true,
                subImages: ["image/基本長褲版型(7-1).png"],
                description: [
                    { html: '1. <span class="badge-red">紅</span>：垂直畫出脇邊線至褲口' },
                    { html: '2. <span class="badge-blue">藍</span>：量出膝線上 VW 線段長度 ⏀，自 W 點往左取 ⏀ 得 X 點，連接 YX 畫出後片股下線弧度' },
                    { html: '3. <span class="badge-green">綠</span>：自 X 點垂直往下並連接褲口線，後片完成' }
                ]
            }
        ];

        function switchTab(tabNum) {
            currentTab = tabNum;
            document.getElementById('tab1-btn').classList.toggle('active', tabNum === 1);
            document.getElementById('tab2-btn').classList.toggle('active', tabNum === 2);
            document.getElementById('tab1-content').classList.toggle('active', tabNum === 1);
            document.getElementById('tab2-content').classList.toggle('active', tabNum === 2);
            if (tabNum === 2) renderStep();
        }

        function prevStep() { if (currentStep > 0) { currentStep--; renderStep(); } }
        function nextStep() { if (currentStep < stepsData.length - 1) { currentStep++; renderStep(); } }

        function handleImageError(type, el) {
            if (type === 'main') {
                const img = document.getElementById('stepImage');
                const placeholder = document.getElementById('imagePlaceholder');
                img.classList.add('hidden');
                placeholder.classList.remove('hidden');
            } else if (type === 'sub' && el) {
                el.classList.add('hidden');
                const p = el.nextElementSibling;
                if(p) p.classList.remove('hidden');
            }
        }

        function renderStep() {
            if (stepsData.length === 0) return;
            const step = stepsData[currentStep];
            
            document.getElementById('stepCounter').innerText = `${currentStep + 1} / ${stepsData.length}`;
            
            // 1. 處理主圖與框比例
            const mainFrame = document.getElementById('mainFrame');
            const img = document.getElementById('stepImage');
            const placeholder = document.getElementById('imagePlaceholder');
            
            // 根據是否為長圖切換 CSS 類別
            if (step.isLongImage) {
                mainFrame.classList.add('long-format');
            } else {
                mainFrame.classList.remove('long-format');
            }

            if (step.fileName) {
                img.src = step.fileName;
                img.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                img.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }

            // 2. 處理步驟文字
            const descContainer = document.getElementById('stepDescription');
            descContainer.innerHTML = "";
            step.description.forEach(part => {
                const p = document.createElement('p');
                let content = part.html || part.text;
                p.innerHTML = content.replace(/\{\{(v\d+)\}\}/g, (match, vName) => calculations[vName] || "0.0");
                descContainer.appendChild(p);
            });

            // 3. 處理補充圖片
            const subContainer = document.getElementById('subImagesContainer');
            subContainer.innerHTML = "";
            if (step.subImages && step.subImages.length > 0) {
                step.subImages.forEach(src => {
                    const frame = document.createElement('div');
                    // 補充圖框也要繼承比例樣式
                    frame.className = "image-frame rounded-2xl border border-gray-100" + (step.isLongImage ? " long-format" : "");
                    frame.innerHTML = `
                        <img src="${src}" alt="補充說明圖" class="max-w-full max-h-full object-contain hidden" onload="this.classList.remove('hidden'); this.nextElementSibling.classList.add('hidden')" onerror="handleImageError('sub', this)">
                        <div class="text-gray-300 text-center p-8">
                            <svg class="w-12 h-12 mx-auto mb-2 opacity-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-width="1.5"></path></svg>
                            <p class="text-[10px] font-bold tracking-widest uppercase opacity-40">補充說明圖</p>
                        </div>
                    `;
                    subContainer.appendChild(frame);
                });
            }

            // 4. 處理備註
            const textNoteArea = document.getElementById('textNoteArea');
            const primaryNote = document.getElementById('primaryNoteText');
            if (step.note && step.note.trim() !== "") {
                textNoteArea.classList.remove('hidden');
                primaryNote.innerHTML = step.note.replace(/\n/g, '<br>');
            } else {
                textNoteArea.classList.add('hidden');
            }
        }

        function updateAll() {
            const W = parseFloat(document.getElementById('inputW').value) || 0;
            const H = parseFloat(document.getElementById('inputH').value) || 0;
            const GL = parseFloat(document.getElementById('inputGL').value) || 0;
            const PL = parseFloat(document.getElementById('inputPL').value) || 0;

            const v1 = (H + 4) / 4;
            const v2 = v1 / 4;
            const v3 = (W + 1) / 4 + 1;
            const v4 = (v1 - 0.5 - v3) / 3;
            const v5 = (PL - GL) * 0.4;
            const v6 = (W + 1) / 4 - 1;

            const setVal = (id, val) => {
                const rounded = isNaN(val) ? "0.0" : val.toFixed(1);
                const el = document.getElementById(id);
                if(el) el.innerText = rounded;
                calculations[id] = rounded;
            };

            setVal('v1', v1);
            setVal('v2', v2);
            setVal('v3', v3);
            setVal('v4', v4);
            setVal('v5', v5);
            setVal('v6', v6);

            if (currentTab === 2) renderStep();
        }

        window.onload = updateAll;
    </script>
</body>
</html>
