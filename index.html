<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新文化式原型計算器</title>

    <!-- 1. 引入 Manifest (新增) -->
    <link rel="manifest" href="manifest.json">

    <!-- 2. 註冊 Service Worker (新增) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6; /* 淺灰色背景 */
        }
        /* 圓角與陰影 */
        .custom-card {
            border-radius: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
            display: block; /* 讓連結撐開 */
        }
        .custom-card:active {
            transform: scale(0.98);
        }

        /* 安裝提示框動畫 */
        #install-modal {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #install-modal.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .modal-content {
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #install-modal:not(.hidden) .modal-content {
            transform: scale(1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-700">

    <!-- 安裝提示框 (Modal) -->
    <div id="install-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-900/40 backdrop-blur-sm hidden">
        <div class="modal-content bg-white w-full max-w-xs custom-card p-8 text-center">
            <div class="mb-6">
                <div class="w-20 h-20 bg-white rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-sm border border-gray-50 overflow-hidden">
                    <img src="icon.png" alt="App Icon" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23e2e8f0%22><rect width=%2224%22 height=%2224%22/></svg>'" class="w-full h-full object-cover">
                </div>
                <h2 class="text-xl font-black text-slate-800 tracking-tight">安裝應用程式</h2>
                <p class="text-sm text-gray-400 mt-2 leading-relaxed">將此工具添加到主畫面<br>獲得更流暢的打版體驗</p>
            </div>
            
            <div class="flex gap-3 mt-6">
                <button onclick="closeInstallModal()" class="flex-1 py-3 bg-gray-100 text-gray-500 rounded-xl font-bold text-xs tracking-wider active:scale-95 transition-transform">
                    稍後再說
                </button>
                <button onclick="closeInstallModal()" class="flex-1 py-3 bg-slate-800 text-white rounded-xl font-bold text-xs tracking-wider active:scale-95 transition-transform">
                    安裝
                </button>
            </div>
            
            <div class="mt-6 pt-6 border-t border-gray-50">
                <p class="text-[10px] text-gray-400 leading-tight">
                    點擊瀏覽器選單中的 <span class="font-bold text-gray-600">「加入主畫面」</span> 以完成安裝
                </p>
            </div>
        </div>
    </div>

    <main class="flex-grow max-w-md mx-auto w-full p-6 flex flex-col">
        <!-- 首頁主選單 -->
        <section id="home-panel" class="flex-grow flex flex-col justify-center space-y-8 text-center min-h-[85vh] py-10">
            <div class="mb-4">
                <h1 class="text-2xl font-black text-slate-800 tracking-[0.2em]">新文化式原型計算器</h1>
            </div>

            <!-- 版型按鈕列表：連結至外部 HTML 檔案 -->
            <div class="grid gap-4 text-left">
                <!-- 女子原型 -->
                <a href="女子原型計算機.html" class="custom-card w-full bg-white p-6 border-b-4 border-pink-500 relative">
                    <span class="text-[10px] font-bold text-pink-500 tracking-[0.3em] uppercase opacity-80">WOMEN</span>
                    <h3 class="text-xl font-black text-gray-800 mt-1">女子新文化式上衣原型</h3>
                </a>

                <!-- 男子原型 -->
                <a href="男子原型計算機.html" class="custom-card w-full bg-white p-6 border-b-4 border-blue-500 relative">
                    <span class="text-[10px] font-bold text-blue-500 tracking-[0.3em] uppercase opacity-80">MEN</span>
                    <h3 class="text-xl font-black text-gray-800 mt-1">男子新文化式上衣原型</h3>
                </a>

                <!-- 兒童原型 -->
                <a href="兒童原型計算機.html" class="custom-card w-full bg-white p-6 border-b-4 border-yellow-500 relative">
                    <span class="text-[10px] font-bold text-yellow-600 tracking-[0.3em] uppercase opacity-80">KIDS</span>
                    <h3 class="text-xl font-black text-gray-800 mt-1">兒童新文化式上衣原型</h3>
                </a>

                <!-- 基本長褲 -->
                <a href="基本長褲計算機.html" class="custom-card w-full bg-white p-6 border-b-4 border-emerald-500 relative">
                    <span class="text-[10px] font-bold text-emerald-500 tracking-[0.3em] uppercase opacity-80">TROUSERS</span>
                    <h3 class="text-xl font-black text-gray-800 mt-1">基本長褲版型</h3>
                </a>

                <!-- 基本窄裙 -->
                <a href="基本窄裙計算機.html" class="custom-card w-full bg-white p-6 border-b-4 border-purple-500 relative">
                    <span class="text-[10px] font-bold text-purple-500 tracking-[0.3em] uppercase opacity-80">SKIRT</span>
                    <h3 class="text-xl font-black text-gray-800 mt-1">基本窄裙版型</h3>
                </a>
            </div>
        </section>
    </main>

    <script>
        window.onload = function() {
            setTimeout(() => {
                const modal = document.getElementById('install-modal');
                if(modal) modal.classList.remove('hidden');
            }, 1000);
        };

        function closeInstallModal() {
            document.getElementById('install-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
