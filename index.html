<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新文化式原型計算器</title>

    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            /* 固定高度，禁止捲動 */
            overflow: hidden; 
            height: 100vh;
        }
        .custom-card {
            border-radius: 1.25rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .custom-card:active {
            transform: scale(0.98);
        }
        #install-modal {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #install-modal.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .modal-content {
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #install-modal:not(.hidden) .modal-content {
            transform: scale(1);
        }
    </style>
</head>
<body class="h-screen flex flex-col text-gray-700">

    <!-- 安裝提示框 (Modal) -->
    <div id="install-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-900/40 backdrop-blur-sm hidden">
        <div class="modal-content bg-white w-full max-w-xs custom-card p-8 text-center">
            <div class="mb-6">
                <div class="w-20 h-20 bg-white rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-sm border border-gray-50 overflow-hidden">
                    <img src="icon.png" alt="App Icon" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23e2e8f0%22><rect width=%2224%22 height=%2224%22/></svg>'" class="w-full h-full object-cover">
                </div>
                <h2 class="text-xl font-black text-slate-800 tracking-tight">安裝應用程式</h2>
                <p class="text-sm text-gray-400 mt-2 leading-relaxed">將此工具添加到主畫面<br>獲得更流暢的打版體驗</p>
            </div>
            
            <div class="flex gap-3 mt-6">
                <button onclick="closeInstallModal()" class="flex-1 py-3 bg-gray-100 text-gray-500 rounded-xl font-bold text-xs tracking-wider active:scale-95 transition-transform">
                    稍後再說
                </button>
                <button onclick="triggerInstall()" class="flex-1 py-3 bg-slate-800 text-white rounded-xl font-bold text-xs tracking-wider active:scale-95 transition-transform">
                    安裝
                </button>
            </div>
        </div>
    </div>

    <!-- 主內容區 -->
    <main class="flex-1 max-w-md mx-auto w-full px-6 py-6 flex flex-col overflow-hidden">
        
        <!-- 標題 -->
        <header class="text-center py-6">
            <h1 class="text-xl font-black text-slate-800 tracking-[0.2em]">新文化式原型計算器</h1>
        </header>

        <!-- 選單列表 -->
        <nav class="flex-1 flex flex-col justify-center space-y-4">
            
            <a href="女子原型計算機.html" class="custom-card bg-white px-6 py-5 border-b-4 border-pink-500">
                <span class="text-[9px] font-bold text-pink-500 tracking-[0.3em] uppercase opacity-80">WOMEN</span>
                <h3 class="text-lg font-black text-gray-800">女子新文化式上衣原型</h3>
            </a>

            <a href="男子原型計算機.html" class="custom-card bg-white px-6 py-5 border-b-4 border-blue-500">
                <span class="text-[9px] font-bold text-blue-500 tracking-[0.3em] uppercase opacity-80">MEN</span>
                <h3 class="text-lg font-black text-gray-800">男子新文化式上衣原型</h3>
            </a>

            <a href="兒童原型計算機.html" class="custom-card bg-white px-6 py-5 border-b-4 border-yellow-500">
                <span class="text-[9px] font-bold text-yellow-600 tracking-[0.3em] uppercase opacity-80">KIDS</span>
                <h3 class="text-lg font-black text-gray-800">兒童新文化式上衣原型</h3>
            </a>

            <a href="基本長褲計算機.html" class="custom-card bg-white px-6 py-5 border-b-4 border-emerald-500">
                <span class="text-[9px] font-bold text-emerald-500 tracking-[0.3em] uppercase opacity-80">TROUSERS</span>
                <h3 class="text-lg font-black text-gray-800">基本長褲版型</h3>
            </a>

            <a href="基本窄裙計算機.html" class="custom-card bg-white px-6 py-5 border-b-4 border-purple-500">
                <span class="text-[9px] font-bold text-purple-500 tracking-[0.3em] uppercase opacity-80">SKIRT</span>
                <h3 class="text-lg font-black text-gray-800">基本窄裙版型</h3>
            </a>

        </nav>

        <!-- 頁腳已移除英文文字 -->
        <footer class="text-center pt-4 pb-2">
            <!-- 已移除 Professional Pattern System -->
        </footer>
    </main>

    <script>
        let deferredPrompt;

        // 改進後的註冊邏輯，避免在不支援的協議下報錯
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const isLocalOrBlob = window.location.protocol === 'blob:' || window.location.protocol === 'file:';
                
                if (!isLocalOrBlob) {
                    navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker 註冊成功'))
                    .catch(err => {
                        // 僅在非 HTTPS 下顯示較詳細的錯誤
                        if (window.location.protocol !== 'https:') {
                            console.warn('PWA 需要 HTTPS 環境才能運作。');
                        } else {
                            console.error('Service Worker 註冊失敗:', err);
                        }
                    });
                } else {
                    console.log('目前環境不支援 Service Worker (Blob/File)，請部署後測試。');
                }
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(() => {
                const modal = document.getElementById('install-modal');
                if(modal) modal.classList.remove('hidden');
            }, 1500);
        });

        async function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                closeInstallModal();
            } else {
                alert("請點擊瀏覽器選單中的「加入主畫面」進行安裝。");
                closeInstallModal();
            }
        }

        function closeInstallModal() {
            document.getElementById('install-modal').classList.add('hidden');
        }

        window.addEventListener('appinstalled', () => {
            closeInstallModal();
        });

        if (window.matchMedia('(display-mode: standalone)').matches) {
            closeInstallModal();
        }
    </script>
</body>
</html>
